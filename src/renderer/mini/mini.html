<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Horologium mini player</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #141414; color: #eee; font: 11px system-ui, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
    .bar { display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 4px 0 8px; background: #1d1d1d; -webkit-app-region: drag; cursor: grab; }
    .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; opacity: 0.85; }
    button { -webkit-app-region: no-drag; width: 22px; height: 18px; border: 0; border-radius: 3px; background: transparent; color: #eee; font-size: 12px; line-height: 1; cursor: pointer; }
    button:hover { background: #3a3a3a; }
    button:focus-visible { outline: 2px solid #ff6b5b; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="title" id="title"></span>
    <button id="expand" type="button">&#x2922;</button>
    <button id="close" type="button">&#x2715;</button>
  </div>
  <script type="module" src="mini.js"></script>
</body>
</html>
