<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- The app sets --fill (0 to 1, today's progress) on the wrapper. The water group below is moved up
       as it fills; the clipPath keeps the water inside the glass. -->
  <defs>
    <clipPath id="glass-inside"><rect x="70" y="30" width="100" height="140" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#glass-inside)">
    <g data-part="water"><rect x="60" y="30" width="120" height="160"/></g>
  </g>
  <rect data-part="glass" x="70" y="30" width="100" height="140" rx="14" fill="none" stroke-width="5"/>
</svg>
